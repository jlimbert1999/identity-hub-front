<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <h1 class="text-2xl font-bold text-slate-800 mb-2">Mis Sistemas</h1>
  <p class="text-sm text-slate-500 mb-6">Sistemas institucionales habilitados para su usuario.</p>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (app of applications(); track $index) {
    <div
      class="group relative overflow-hidden rounded-2xl border border-surface-200 bg-surface-0 p-6 shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-2"
    >
      <div class="absolute top-0 left-0 h-3 w-full" [style.backgroundColor]="app.color"></div>
      <div class="flex flex-col h-full justify-between">
        <div>
          <h3 class="text-lg font-bold text-slate-800 group-hover:text-blue-600 transition-colors">
            <pre>{{ app.application.name | json }}</pre>
          </h3>
          <p class="mt-2 text-sm text-slate-500 line-clamp-2">
            {{ app.description }}
          </p>
        </div>

        <div class="mt-6 flex items-center justify-between">
          <span class="text-xs font-medium uppercase tracking-wider text-slate-400">Entrar</span>
          <i
            class="pi pi-arrow-right text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"
          ></i>
        </div>
      </div>
    </div>
    }
  </div>
</section>
